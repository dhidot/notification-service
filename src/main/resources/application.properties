spring.application.name=notification-service
server.port=8082

management.endpoints.web.exposure.include=health,info

# SMTP configuration: Mailpit on localhost for development.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

careertrack.mail.from=${MAIL_FROM:no-reply@careertrack.test}

# Service-to-service credential; required at startup, never commit a production value.
careertrack.internal.api-key=${INTERNAL_API_KEY:}
